const $=id=>document.getElementById(id);const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const SYL=['MA','ME','MI','MO','MU','PA','PE','PI','PO','PU','TA','TE','TI','TO','TU','LA','LE','LI','LO','LU','SA','SE','SI','SO','SU','KA','KE','KI','KO','KU','BA','BE','BI','BO','BU','DA','DE','DI','DO','DU','RA','RE','RI','RO','RU','NA','NE','NI','NO','NU','WA','WE','WI','WO','WU','ZA','ZE','ZI','ZO','ZU'];
const ITEMS=[['MAMA',['MA','MA'],'👩'],['TATA',['TA','TA'],'👨'],['LALA',['LA','LA'],'🪆'],['WODA',['WO','DA'],'💧'],['RYBA',['RY','BA'],'🐟'],['SOWA',['SO','WA'],'🦉'],['MAPA',['MA','PA'],'🗺️'],['RAMA',['RA','MA'],'🖼️'],['KAWA',['KA','WA'],'☕'],['KURA',['KU','RA'],'🐔'],['KOZA',['KO','ZA'],'🐐'],['NOGA',['NO','GA'],'🦵'],['RĘKA',['RĘ','KA'],'✋'],['BUDA',['BU','DA'],'🏠'],['TAMA',['TA','MA'],'🌊'],['LATO',['LA','TO'],'☀️'],['ZIMA',['ZI','MA'],'❄️'],['MOTYL',['MO','TYL'],'🦋'],['KOTEK',['KO','TEK'],'🐱'],['DOMEK',['DO','MEK'],'🏡'],['PIŁKA',['PIŁ','KA'],'⚽'],['AUTO',['AU','TO'],'🚗'],['ROWER',['RO','WER'],'🚲'],['KOTEK',['KO','TEK'],'🐈']];
const WORDS=[['KOT','🐱'],['DOM','🏠'],['LAS','🌲'],['PIŁKA','⚽'],['AUTO','🚗'],['RYBA','🐟'],['SOWA','🦉'],['MAPA','🗺️'],['RAK','🦞'],['ROWER','🚲'],['BUT','👟'],['NOS','👃'],['OKO','👁️'],['POMIDOR','🍅'],['KURA','🐔'],['KOZA','🐐'],['MOTYL','🦋'],['WODA','💧']];
let mode='syllable',round=0,goals=0,deck=[],task=null,busy=false,muted=false,clips={},last={},token=0,audio=new Audio(),ctx=null,attempts={};audio.preload='auto';
fetch('commentator_timings.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(j=>{for(const c of Object.values(j)){(clips[c.event]??=[]).push(c)}}).catch(()=>{});
function stop(){token++;audio.pause();audio.ontimeupdate=null;audio.onloadedmetadata=null}
function say(event){stop();if(muted)return;const pool=clips[event]||[];if(!pool.length)return;const choices=pool.filter(c=>c!==last[event]);const c=shuffle(choices.length?choices:pool)[0];last[event]=c;const t=token;function play(){if(t!==token)return;try{audio.currentTime=c.start;audio.ontimeupdate=()=>{if(audio.currentTime>=c.end)stop()};audio.play().catch(()=>{});}catch(e){}}if(!audio.src.endsWith('/'+c.file)){audio.src=c.file;audio.onloadedmetadata=play;audio.load()}else if(audio.readyState>=1)play();else audio.onloadedmetadata=play}
function fx(kind){if(muted)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='triangle';o.frequency.setValueAtTime(kind==='goal'?650:160,t);o.frequency.exponentialRampToValueAtTime(kind==='goal'?1100:50,t+.2);g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.27);o.connect(g);g.connect(ctx.destination);o.start();o.stop(t+.28)}catch(e){}}
$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'Dźwięk ×':'Dźwięk ✓';if(muted)stop()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('selected',x===b))});
function makeDeck(){if(mode==='syllable')return shuffle(SYL).slice(0,10).map(x=>({kind:mode,target:x}));if(mode==='word')return shuffle(WORDS).slice(0,10).map(x=>({kind:mode,target:x[0],icon:x[1]}));return shuffle(ITEMS.filter((x,i,a)=>a.findIndex(y=>y[0]===x[0])===i)).slice(0,10).map(x=>({kind:mode,target:x[0],parts:x[1],icon:x[2]}))}
function start(){round=goals=0;attempts={};deck=makeDeck();$('menu').hidden=true;$('game').hidden=false;render();say('welcome')};$('start').onclick=start;$('back').onclick=()=>{stop();$('game').hidden=true;$('menu').hidden=false};
function clearScene(){for(const a of $('ball').getAnimations())a.cancel();$('ball').style.opacity='1';$('ball').style.transform='translate(-50%,-50%)';$('player').src='player.png';$('player').style.transform='';$('keeper').src='keeper.png';$('keeper').style.transform='';$('message').classList.remove('show')}
function scoreboard(){$('round').textContent=`ZADANIE ${Math.min(round+1,10)} / 10`;$('score').textContent=`GOLE ${goals}`;$('bar').style.width=round*10+'%'}
function render(){busy=false;clearScene();scoreboard();$('next').hidden=true;$('repeat').hidden=true;$('answers').replaceChildren();$('status').textContent='';if(round>=10){$('instruction').textContent='Koniec meczu!';$('prompt').textContent='🏆 BRAWO, SZYMON!';$('next').textContent='Nowy mecz';$('next').hidden=false;$('bar').style.width='100%';say('victory');return}task=deck[round];let opts=[],answer='',label='';if(mode==='syllable'){answer=task.target;opts=[answer,...shuffle(SYL.filter(x=>x!==answer)).slice(0,2)];$('instruction').textContent='Posłuchaj sylaby i wybierz ją';$('prompt').textContent='🔊 ?';$('repeat').hidden=false;}
else if(mode==='join'){answer=task.parts[1];opts=[answer,...shuffle([...new Set([...SYL,...ITEMS.flatMap(x=>x[1])])].filter(x=>x!==answer&&x.length===answer.length)).slice(0,2)];$('instruction').textContent='Wybierz drugą sylabę, aby powstało słowo';$('prompt').textContent=task.parts[0]+' + ? = ...';}
else if(mode==='missing'){const missing=Math.random()<.5?0:1;task.missing=missing;answer=task.parts[missing];opts=[answer,...shuffle([...new Set([...SYL,...ITEMS.flatMap(x=>x[1])])].filter(x=>x!==answer&&x.length===answer.length)).slice(0,2)];$('instruction').textContent='Uzupełnij brakującą sylabę';$('prompt').textContent=task.parts.map((x,i)=>i===missing?'__':x).join(' + ')+'   '+task.icon;}
else{answer=task.target;opts=[task,...shuffle(WORDS.filter(x=>x[0]!==answer)).slice(0,2).map(x=>({target:x[0],icon:x[1]}))];$('instruction').textContent='Przeczytaj słowo i wskaż obrazek';$('prompt').textContent=answer;}
shuffle(opts).forEach(x=>{const b=document.createElement('button');const val=mode==='word'?(Array.isArray(x)?x[0]:x.target):x;b.textContent=mode==='word'?(Array.isArray(x)?x[1]:x.icon):val;b.setAttribute('aria-label',mode==='word'?val:('Sylaba '+val));b.onclick=()=>choose(val===answer,b);$('answers').append(b)});if(mode==='syllable')speakSyllable();else say(({join:'join_syllables',missing:'missing_syllable',word:'choose_image'})[mode]);}
function speakSyllable(){if(muted)return;stop();if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(task.target.toLowerCase());u.lang='pl-PL';u.rate=.78;u.pitch=1.05;speechSynthesis.speak(u)}else $('status').textContent='Odczytaj sylabę: '+task.target}
$('repeat').onclick=speakSyllable;
function confetti(){for(let i=0;i<24;i++){const p=document.createElement('i');p.className='confetti';p.style.left=Math.random()*100+'%';p.style.background=['#fff','#358aff','#ffe177'][i%3];p.style.setProperty('--dx',(Math.random()*150-75)+'px');$('field').append(p);setTimeout(()=>p.remove(),1900)}}
function choose(ok,b){if(busy)return;busy=true;stop();if('speechSynthesis'in window)speechSynthesis.cancel();const btns=[...$('answers').children];btns.forEach(x=>x.disabled=true);b.classList.add(ok?'good':'bad');$('player').style.transform='translateX(20%) rotate(-5deg)';setTimeout(()=>{$('player').style.transform='translateX(35%) rotate(7deg)';fx('kick');const f=$('field');const dx=f.clientWidth*(ok?.13:.36),dy=f.clientHeight*(ok?-.42:-.18);$('ball').animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:`translate(calc(-50% + ${dx*.55}px),calc(-50% + ${dy*.7}px)) scale(.65)`,offset:.5},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.25)`}],{duration:650,fill:'forwards',easing:'ease-out'});$('keeper').style.transform=ok?'translateX(-75%) rotate(-28deg)':'translateX(55%) rotate(20deg)'},240);setTimeout(()=>{if(ok){goals++;$('message').textContent='GOOOOL!';$('message').classList.add('show');$('status').textContent='Brawo! Dobra odpowiedź!';$('player').style.transform='translateX(35%) translateY(-8px)';fx('goal');say('goal');confetti();$('next').textContent='Dalej ▶';$('next').hidden=false;scoreboard()}else{$('message').textContent='JESZCZE RAZ!';$('message').classList.add('show');$('status').textContent='Spróbuj ponownie — dasz radę!';say('retry');setTimeout(()=>{clearScene();btns.forEach(x=>x.disabled=false);b.classList.remove('bad');busy=false},1150)}},950)}
$('next').onclick=()=>{if(round>=10){start();return}round++;render()};
</script></body></html>
