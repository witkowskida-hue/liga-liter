<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liga Liter — Szymon</title><style>*{box-sizing:border-box}body{margin:0;background:#061331;color:white;font: bold 18px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:12px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:clamp(22px,5vw,42px);margin:8px;color:#ffd54c;text-shadow:0 3px #774500}button{font:inherit;cursor:pointer;border:2px solid #70cfff;border-radius:18px;background:linear-gradient(#fff,#cddfff);color:#092467;box-shadow:0 0 12px #168dff;padding:12px}button:disabled{cursor:default;opacity:.7}.field{position:relative;aspect-ratio:2.42;background:url(stadium.webp) center/100% 100%;border:2px solid #56bfff;border-radius:20px;overflow:hidden}.player,.keeper{position:absolute;object-fit:contain;filter:drop-shadow(0 5px 4px #0008);transition:transform .45s}.player{height:58%;left:12%;bottom:0}.keeper{height:24%;left:47%;bottom:26%}.ball{position:absolute;left:38%;bottom:10%;font-size:clamp(22px,5vw,55px);transition:all .65s ease-out;z-index:3}.shot{left:56%;bottom:43%;transform:scale(.38) rotate(440deg)}.save{left:49%;bottom:33%;transform:scale(.45) rotate(250deg)}.message{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:clamp(38px,10vw,100px);color:#ffe25c;text-shadow:3px 4px #092467,0 0 25px #ffac00;opacity:0;transition:opacity .2s}.show{opacity:1}.task{text-align:center;background:#102958;border-radius:18px;padding:12px;margin:12px 0}.word{font-size:clamp(35px,8vw,65px);letter-spacing:3px;margin:6px}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.answers button{font-size:clamp(38px,8vw,65px);min-height:76px}.status{text-align:center;min-height:30px;margin:8px}.good{background:#9cff96}.bad{background:#ffe3a0}.small{font-size:14px;color:#cde4ff}#next{display:block;margin:10px auto;background:#8bf58a}#next[hidden]{display:none}</style></head><body><main><header><div>SZYMON · 10</div><h1>LIGA LITER</h1><div id="score">⚽ 0/10</div></header><div class="field"><img class="player" id="player" src="player.png" alt="Piłkarz"><img class="keeper" id="keeper" src="keeper.png" alt="Bramkarz"><div class="ball" id="ball">⚽</div><div class="message" id="message"></div></div><section class="task"><div>Przeczytaj słowo i wybierz obrazek</div><div class="word" id="word"></div><div class="answers" id="answers"></div><div class="status" id="status" aria-live="polite"></div><button id="next" hidden>Dalej ▶</button></section><div class="small">Trening bez limitu czasu · 10 zadań · wersja testowa bez dźwięku</div></main><script>const words=[['KOT','🐱'],['DOM','🏠'],['LAS','🌲'],['PIŁKA','⚽'],['AUTO','🚗'],['RYBA','🐟'],['SOWA','🦉'],['MAPA','🗺️'],['RAK','🦞'],['ROWER','🚲'],['LALKA','🪆'],['BUT','👟'],['NOS','👃'],['OKO','👁️'],['POMIDOR','🍅']];const shuffle=a=>a.slice().sort(()=>Math.random()-.5);let round=0,score=0,busy=false,deck=shuffle(words).slice(0,10);const $=id=>document.getElementById(id);function reset(){round=score=0;deck=shuffle(words).slice(0,10);render()}function render(){busy=false;$('ball').className='ball';$('player').style.transform='';$('keeper').style.transform='';$('message').className='message';$('next').hidden=true;$('status').textContent='';$('score').textContent=`⚽ ${score}/10`;if(round===10){$('word').textContent='KONIEC MECZU!';$('answers').replaceChildren();$('status').textContent=`Brawo, Szymon! Zdobyte gole: ${score}.`;$('next').textContent='Nowy mecz';$('next').hidden=false;return}let task=deck[round];$('word').textContent=task[0];$('answers').replaceChildren();shuffle([task,...shuffle(words.filter(x=>x!==task)).slice(0,2)]).forEach(x=>{let b=document.createElement('button');b.textContent=x[1];b.setAttribute('aria-label',x[0]);b.onclick=()=>answer(x===task,b);$('answers').append(b)})}function answer(ok,b){if(busy)return;busy=true;let buttons=[...$('answers').children];buttons.forEach(x=>x.disabled=true);b.classList.add(ok?'good':'bad');$('player').style.transform='translateX(25%) rotate(8deg)';setTimeout(()=>{$('ball').classList.add(ok?'shot':'save');$('keeper').style.transform=ok?'translateX(-90%) rotate(-35deg)':'translateX(20%) rotate(20deg)'},250);setTimeout(()=>{$('message').textContent=ok?'GOOOOL!':'OBRONA!';$('message').classList.add('show');if(ok){score++;$('score').textContent=`⚽ ${score}/10`;$('status').textContent='Świetnie przeczytane!';$('next').textContent='Dalej ▶';$('next').hidden=false}else{$('status').textContent='Spróbuj jeszcze raz.';setTimeout(()=>{busy=false;buttons.forEach(x=>x.disabled=false);b.classList.remove('bad');$('ball').className='ball';$('player').style.transform='';$('keeper').style.transform='';$('message').className='message'},850)}},950)}$('next').onclick=()=>{if(round===10)reset();else{round++;render()}};render();</script></body></html>
