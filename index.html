<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liga Liter v0.2</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#214b95,#07132c 70%);color:white;font:700 17px system-ui,sans-serif;min-height:100dvh}main{max-width:1000px;margin:auto;padding:10px}header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}h1{font-size:clamp(24px,5vw,42px);font-style:italic;margin:0;color:#ffe182;text-shadow:0 3px #654a17}small{font-size:12px;color:#b9d4ff}button{font:inherit;cursor:pointer;border:0;border-radius:14px;background:linear-gradient(#fff,#c9e1ff);color:#12316c;padding:12px;box-shadow:0 4px #527db5}button:disabled{cursor:default}button:active{transform:translateY(2px)}.field{position:relative;aspect-ratio:2.1;background:url(stadium.webp) center/100% 100%;border:2px solid #76c8ff;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #0007}.player,.keeper{position:absolute;object-fit:contain;filter:drop-shadow(0 5px 4px #0008);transition:transform .55s}.player{height:61%;left:12%;bottom:0}.keeper{height:20%;left:46%;bottom:27%;width:8%}.ball{position:absolute;left:35%;top:88%;width:7%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:3;filter:drop-shadow(0 3px 2px #0008)}.message{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:clamp(40px,11vw,100px);color:#ffe25c;text-shadow:3px 4px #092467,0 0 25px #ffac00;opacity:0;transition:opacity .2s}.show{opacity:1}.task{text-align:center;background:linear-gradient(145deg,#193d79,#102449);border:1px solid #416ba8;border-radius:18px;padding:10px;margin:10px 0}.word{font-size:clamp(38px,9vw,65px);letter-spacing:3px;margin:2px;color:#fff}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.answers button{min-height:76px;font-size:clamp(35px,8vw,60px)}.answers svg{width: min(100%,90px);height:70px;display:block;margin:auto}.status{text-align:center;min-height:24px;margin:8px}.good{background:#9cff96}.bad{background:#ffe3a0}#next{background:#a0f28d;margin:4px auto} [hidden]{display:none!important}.progress{height:7px;border-radius:10px;background:#263e69;overflow:hidden;margin:7px 0}.progress div{height:100%;background:linear-gradient(90deg,#58cfff,#ffd95b);transition:width .4s}.cover{position:absolute;inset:0;background:linear-gradient(0deg,#06142ce8,#10294c44);display:grid;place-content:center;text-align:center;gap:12px;z-index:5}.cover h2{font-size:clamp(24px,6vw,55px);margin:0;text-shadow:0 3px #000}.primary{background:linear-gradient(#ffe997,#ffba36);box-shadow:0 4px #a96b12;color:#332000}.sound{font-size:15px;padding:8px}.confetti{position:absolute;width:8px;height:13px;top:-15px;animation:fall 1.6s linear forwards;pointer-events:none;z-index:4}@keyframes fall{to{transform:translate(var(--dx),430px) rotate(630deg);opacity:0}}@media(min-width:700px){.field{aspect-ratio:2.42}}@media(max-height:600px) and (orientation:landscape){main{max-width:760px}.field{max-height:38vh}.answers button{min-height:50px}.answers svg{height:40px}}
</style></head><body><main><header><div>SZYMON · 10<br><small>LIGA BIAŁO-NIEBIESKICH</small></div><h1>LIGA LITER</h1><button class="sound" id="sound" aria-label="Włącz lub wyłącz dźwięk">Dźwięk ✓</button></header><div class="field" id="field"><img class="player" id="player" src="player.png" alt="Piłkarz"><img class="keeper" id="keeper" src="keeper.png" alt="Bramkarz"><svg class="ball" id="ball" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#fff" stroke="#17243c" stroke-width="4"/><path d="M50 28 72 44 64 69 36 69 28 44Z M15 17 30 10 38 25 22 42 5 35Z M85 17 70 10 62 25 78 42 95 35Z M7 67 25 64 38 84 32 94 16 85Z M93 67 75 64 62 84 68 94 84 85Z" fill="#18273d"/></svg><div class="message" id="message"></div><div class="cover" id="cover"><h2>Wielki mecz!</h2><div>10 zadań · 10 szans na gola</div><button class="primary" id="start">ROZPOCZNIJ MECZ</button></div></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span id="score">GOLE 0 / 10</span><span id="round">ZADANIE 1 / 10</span></div><div class="progress"><div id="progress" style="width:0"></div></div><section class="task" id="task" hidden><small>PRZECZYTAJ SŁOWO I WYBIERZ OBRAZEK</small><div class="word" id="word"></div><div class="answers" id="answers"></div><div class="status" id="status" aria-live="polite"></div><button id="next" hidden>Dalej</button></section><small>Bez limitu czasu · Liga Liter v0.2</small></main><script>
const $=id=>document.getElementById(id);const words=[['KOT','🐱'],['DOM','🏠'],['LAS','🌲'],['PIŁKA','⚽'],['AUTO','🚗'],['RYBA','🐟'],['SOWA','🦉'],['MAPA','🗺️'],['RAK','🦞'],['ROWER','🚲'],['BUT','👟'],['NOS','👃'],['OKO','👁️'],['POMIDOR','🍅']];function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}let deck,round=0,score=0,busy=false,muted=false,clips={},last={},audio=new Audio(),token=0,ctx;audio.preload='auto';
const ready=fetch('commentator_timings.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(j=>{for(const x of Object.values(j)){if(!clips[x.event])clips[x.event]=[];clips[x.event].push(x)}}).catch(()=>{});
function stop(){token++;audio.pause();audio.ontimeupdate=null;audio.onloadedmetadata=null}function say(event){stop();if(muted)return;const pool=clips[event]||[];if(!pool.length)return;const opts=pool.filter(x=>x!==last[event]);const c=shuffle(opts.length?opts:pool)[0];last[event]=c;const t=token;function play(){if(t!==token)return;try{audio.currentTime=c.start;audio.ontimeupdate=()=>{if(audio.currentTime>=c.end)stop()};audio.play().catch(()=>{});const check=()=>{if(t!==token)return;if(audio.currentTime>=c.end){stop();return}requestAnimationFrame(check)};requestAnimationFrame(check)}catch(e){}}if(audio.getAttribute('src')!==c.file){audio.src=c.file;audio.onloadedmetadata=play;audio.load()}else if(audio.readyState>=1)play();else audio.onloadedmetadata=play}
function fx(kind){if(muted)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type=kind==='kick'?'triangle':'sine';o.frequency.setValueAtTime(kind==='kick'?130:kind==='goal'?660:1000,t);o.frequency.exponentialRampToValueAtTime(kind==='kick'?45:kind==='goal'?1100:700,t+.18);g.gain.setValueAtTime(.10,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(ctx.destination);o.start();o.stop(t+.32)}catch(e){}}
$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'Dźwięk ×':'Dźwięk ✓';if(muted)stop();else fx('whistle')};function reset(){round=score=0;deck=shuffle(words).slice(0,10);$('cover').hidden=true;$('task').hidden=false;render();say('welcome');fx('whistle')}
$('start').onclick=()=>{reset();if(!Object.keys(clips).length)ready.then(()=>{if(round===0&&!busy)say('welcome')})};function position(){for(const a of $('ball').getAnimations())a.cancel();$('player').style.transform='';$('keeper').style.transform='';$('message').className='message'}function scoreboard(){$('score').textContent=`GOLE ${score} / 10`;$('round').textContent=`ZADANIE ${Math.min(round+1,10)} / 10`;$('progress').style.width=score*10+'%'}function render(){busy=false;position();scoreboard();$('next').hidden=true;$('status').textContent='';$('answers').replaceChildren();if(round===10){$('word').textContent='ZWYCIĘSTWO!';$('status').textContent='Brawo, Szymon! Zdobyłeś 10 bramek!';$('next').textContent='Nowy mecz';$('next').hidden=false;say('victory');confetti();return}const task=deck[round];$('word').textContent=task[0];shuffle([task,...shuffle(words.filter(x=>x!==task)).slice(0,2)]).forEach(x=>{let b=document.createElement('button');b.textContent=x[1];b.setAttribute('aria-label','Obrazek '+x[0]);b.onclick=()=>answer(x===task,b);$('answers').append(b)})}
function confetti(){for(let i=0;i<35;i++){let p=document.createElement('i');p.className='confetti';p.style.left=Math.random()*100+'%';p.style.background=['#fff','#338cff','#ffdf52'][i%3];p.style.setProperty('--dx',(Math.random()*160-80)+'px');p.style.animationDelay=Math.random()*.3+'s';$('field').append(p);setTimeout(()=>p.remove(),2000)}}function answer(ok,b){if(busy)return;busy=true;stop();let buttons=[...$('answers').children];buttons.forEach(x=>x.disabled=true);b.classList.add(ok?'good':'bad');$('player').style.transform='translateX(22%) rotate(8deg)';setTimeout(()=>{fx('kick');let f=$('field'),dx=f.clientWidth*((ok?.56:.50)-.35),dy=f.clientHeight*((ok?.63:.68)-.88);$('ball').animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:`translate(calc(-50% + ${dx*.55}px),calc(-50% + ${dy*1.35}px)) scale(.65) rotate(160deg)`,offset:.55},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.28) rotate(360deg)`}],{duration:650,fill:'forwards',easing:'ease-out'});$('keeper').style.transform=ok?'translateX(-105%) rotate(-54deg)':'translateX(12%) rotate(15deg)'},250);setTimeout(()=>{$('message').textContent=ok?'GOOOOL!':'OBRONA!';$('message').classList.add('show');if(ok){score++;scoreboard();fx('goal');say('goal');confetti();$('status').textContent='Świetnie przeczytane!';$('next').textContent='Dalej ▶';$('next').hidden=false}else{say('retry');$('status').textContent='Spróbuj jeszcze raz.';setTimeout(()=>{position();busy=false;buttons.forEach(x=>x.disabled=false);b.classList.remove('bad')},1200)}},950)}$('next').onclick=()=>{if(round===10)reset();else{round++;render();if(round!==10)stop()}};
</script></body></html>
