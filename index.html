<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06132e">
  <title>Liga Liter v0.5</title>
  <link rel="stylesheet" href="styles.css">
  <script src="game.js" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-shield" viewBox="0 0 40 44">
      <path d="M20 2 37 8v13c0 9-7 15-17 21C10 36 3 30 3 21V8Z" fill="#174bc4" stroke="#82bdff" stroke-width="2"/>
      <path d="m9 10 22 18M9 18l17 15" stroke="#78b4ff" stroke-width="2" opacity=".4"/>
      <path d="M18 14v12h-3V16l-2 1v-3l3-2h2Zm6-2h2c2 0 3 1 3 3v8c0 2-1 3-3 3h-2c-2 0-3-1-3-3v-8c0-2 1-3 3-3Zm0 3v8h2v-8Z" fill="#fff"/>
      <path d="m20 29 1 3h3l-2 2 1 3-3-2-3 2 1-3-2-2h3Z" fill="#ffd76d"/>
    </symbol>
    <symbol id="icon-sound" viewBox="0 0 24 24">
      <path d="M3 9h4l5-4v14l-5-4H3zM16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>
    </symbol>
    <symbol id="icon-mute" viewBox="0 0 24 24">
      <path d="M3 9h4l5-4v14l-5-4H3zM16 10l5 5m0-5-5 5"/>
    </symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 12 7-12 7z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="icon-star" viewBox="0 0 24 24"><path d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></symbol>
    <symbol id="icon-listen" viewBox="0 0 64 64">
      <path d="M13 35v-8a19 19 0 0 1 38 0v8M21 17a15 15 0 0 1 22 0" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="10" y="31" width="12" height="18" rx="5" fill="currentColor"/><rect x="42" y="31" width="12" height="18" rx="5" fill="currentColor"/>
      <path d="M27 42h10m-7 5h4" stroke="#fff3b2" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-join" viewBox="0 0 64 64">
      <path d="M14 27h14a4 4 0 0 1 0 8h-5m18-6h9a7 7 0 1 1 0 14h-9M24 36v6a7 7 0 0 1-7 7h-4a7 7 0 0 1-7-7V25a7 7 0 0 1 7-7h11m16 0v7" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <path d="m40 9 2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fff3b2"/>
    </symbol>
    <symbol id="icon-missing" viewBox="0 0 64 64">
      <rect x="9" y="17" width="46" height="34" rx="8" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="6 6"/>
      <path d="M24 27c0-10 18-10 18 0 0 7-10 6-10 12" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <circle cx="32" cy="45" r="2.5" fill="#fff3b2"/>
    </symbol>
    <symbol id="icon-read" viewBox="0 0 64 64">
      <path d="M32 22c-7-6-14-8-24-6v30c10-2 17 0 24 6 7-6 14-8 24-6V16c-10-2-17 0-24 6zm0 1v28" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
      <path d="M15 26c4 0 7 1 10 3m-10 5c4 0 7 1 10 3m14-8c3-2 6-3 10-3m-10 11c3-2 6-3 10-3" fill="none" stroke="#fff3b2" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
  </svg>

  <main class="app">
    <header class="topbar">
      <button class="brand" id="home" type="button" aria-label="Liga Liter, strona startowa">
        <svg viewBox="0 0 40 44" aria-hidden="true"><use href="#icon-shield"/></svg>
        <span>Liga Liter</span>
      </button>
      <button class="sound" id="sound" type="button" aria-label="Dźwięk" aria-pressed="true">
        <svg class="ui-icon" aria-hidden="true"><use href="#icon-sound"/></svg><span>Wł.</span>
      </button>
    </header>

    <section class="welcome" id="welcome" aria-labelledby="welcome-title">
      <div class="welcome-art" aria-hidden="true">
        <div class="hero-lights"></div>
        <div class="hero-number">10</div>
        <img class="hero-player" src="player.png" width="1197" height="1314" alt="">
      </div>
      <div class="welcome-content">
        <h1 id="welcome-title" class="wordmark"><span>LIGA</span> <span>LITER</span></h1>
        <p class="hero-caption">Szymon <span></span> Biało-niebiescy</p>
      </div>
      <div class="welcome-actions">
        <button class="action action--gold" id="start" type="button"><svg class="ui-icon" aria-hidden="true"><use href="#icon-play"/></svg> GRAJ</button>
        <small class="version">v0.5</small>
      </div>
    </section>

    <section id="menu" class="training screen" aria-labelledby="training-title" hidden>
      <div class="training-header">
        <h1 id="training-title" tabindex="-1">Wybierz<br><em>trening</em></h1>
      </div>
      <div class="modes">
        <button class="mode mode--listen" data-mode="syllable" type="button">
          <svg aria-hidden="true" viewBox="0 0 64 64"><use href="#icon-listen"/></svg>
          <strong>Słucham sylab</strong><small>Wskaż usłyszaną sylabę</small>
        </button>
        <button class="mode mode--join" data-mode="join" type="button">
          <svg aria-hidden="true" viewBox="0 0 64 64"><use href="#icon-join"/></svg>
          <strong>Łączę sylaby</strong><small>Zbuduj słowo</small>
        </button>
        <button class="mode mode--missing" data-mode="missing" type="button">
          <svg aria-hidden="true" viewBox="0 0 64 64"><use href="#icon-missing"/></svg>
          <strong>Brakująca sylaba</strong><small>Uzupełnij słowo</small>
        </button>
        <button class="mode mode--read" data-mode="word" type="button">
          <svg aria-hidden="true" viewBox="0 0 64 64"><use href="#icon-read"/></svg>
          <strong>Czytam słowa</strong><small>Wybierz ilustrację</small>
        </button>
      </div>
    </section>

    <section id="game" class="match screen" aria-label="Mecz" hidden>
      <div class="scoreboard">
        <div class="scoreboard-top">
          <div class="team">
            <svg viewBox="0 0 40 44" aria-hidden="true"><use href="#icon-shield"/></svg>
            <div><strong>SZYMON</strong><span id="round">ZADANIE 1 / 10</span></div>
          </div>
          <span class="score" id="score">GOLE 0</span>
        </div>
        <div class="progress" id="progress" role="progressbar" aria-label="Postęp meczu" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div id="bar"></div></div>
      </div>

      <div class="field" id="field">
        <div class="crowd" aria-hidden="true"></div>
        <div class="stadium-flash" aria-hidden="true"></div>
        <img class="keeper" id="keeper" src="keeper.png" alt="Bramkarz">
        <img class="player" id="player" src="player.png" width="1197" height="1314" alt="Piłkarz">
        <div class="ball" id="ball" aria-hidden="true"></div>
        <div class="message" id="message" aria-hidden="true"></div>
      </div>

      <div class="task">
        <p class="instruction" id="instruction"></p>
        <div class="prompt" id="prompt"></div>
        <div class="answers" id="answers"></div>
        <p class="status" id="status" role="status"></p>
        <div class="task-controls">
          <button class="action action--quiet" id="repeat" type="button" hidden><svg class="ui-icon" aria-hidden="true"><use href="#icon-sound"/></svg> Powtórz sylabę</button>
          <button class="action action--gold" id="next" type="button" hidden><span id="next-label">Dalej</span> <svg class="ui-icon" aria-hidden="true"><use href="#icon-arrow"/></svg></button>
        </div>
      </div>
      <button class="text-button" id="back" type="button">Zmień trening</button>
    </section>

    <section id="summary" class="summary screen" aria-labelledby="summary-title" hidden>
      <div class="summary-art">
        <svg class="trophy" viewBox="0 0 240 240" aria-hidden="true">
          <defs>
            <linearGradient id="cup-gold" x2="1" y2=".65" gradientUnits="objectBoundingBox">
              <stop stop-color="#ffe895"/><stop offset=".32" stop-color="#ffcd58"/><stop offset=".66" stop-color="#bf7017"/><stop offset="1" stop-color="#ffdb71"/>
            </linearGradient>
            <linearGradient id="trophy-base" x2=".85" y2="1" gradientUnits="objectBoundingBox">
              <stop stop-color="#3564c8"/><stop offset="1" stop-color="#091a43"/>
            </linearGradient>
          </defs>
          <ellipse cx="120" cy="218" rx="70" ry="11" fill="#0a1538" opacity=".55"/>
          <path d="M64 53H29c0 38 18 61 51 63m96-63h35c0 38-18 61-51 63" stroke="url(#cup-gold)" stroke-width="11" fill="none"/>
          <path d="M111 137h18v37h-18zM92 184c0-8 8-13 18-13h20c10 0 18 5 18 13Z" fill="url(#cup-gold)"/>
          <path d="M58 44h124v24c0 50-30 80-62 80S58 118 58 68Z" fill="url(#cup-gold)" stroke="#ffd66b" stroke-width="2"/>
          <path d="M58 44h124" stroke="#fff1ad" stroke-width="7" stroke-linecap="round"/>
          <path d="M76 61v12c0 21 8 37 18 46" fill="none" stroke="#fff0a9" stroke-width="4" stroke-linecap="round" opacity=".7"/>
          <path d="m120 66 8 17 19 3-14 13 3 18-16-9-16 9 3-18-14-13 19-3Z" fill="#fff1b1" stroke="#b97719" stroke-width="2"/>
          <path d="M83 183h74l11 24H72z" fill="url(#trophy-base)" stroke="#6ca8ff" stroke-width="2"/>
          <path d="M106 191h28v8h-28z" fill="#f9c54d"/>
        </svg>
      </div>
      <h1 id="summary-title" tabindex="-1">Brawo, Szymon!</h1>
      <p class="final-score" id="final-score"></p>
      <div class="stars" id="stars" role="img">
        <svg aria-hidden="true"><use href="#icon-star"/></svg>
        <svg aria-hidden="true"><use href="#icon-star"/></svg>
        <svg aria-hidden="true"><use href="#icon-star"/></svg>
      </div>
      <p class="first-try" id="first-try"></p>
      <button class="action action--gold" id="replay" type="button"><svg class="ui-icon" aria-hidden="true"><use href="#icon-play"/></svg> ZAGRAJ PONOWNIE</button>
      <button class="text-button" id="summary-back" type="button">Zmień trening</button>
    </section>
  </main>
</body>
</html>
